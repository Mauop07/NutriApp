<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriApp Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="styles.css">
</head>
<body style="opacity: 0; transition: opacity 0.3s;" id="cuerpoApp">
    
    <div class="d-flex flex-row min-vh-100">
        
        <!-- Sidebar -->
        <div class="sidebar bg-white border-end p-3 d-flex flex-column">
            <a href="#" class="d-flex align-items-center mb-4 text-decoration-none text-dark logo-container">
                <img src="assets/icon_login_leaf.png" alt="NutriApp" width="36" height="36" class="me-2">
                <div class="d-flex flex-column">
                    <span class="fs-4 fw-bold lh-1">NutriApp</span>
                    <small class="text-primary fw-bold mt-1" style="font-size: 0.7rem; letter-spacing: 0.5px;">ADMINISTRACIÓN</small>
                </div>
            </a>
            
            <ul class="nav nav-pills flex-column mb-auto">
                <li class="nav-item">
                    <a href="#" class="nav-link active" aria-current="page">
                        <i class="bi bi-basket me-2"></i> Catálogo
                    </a>
                </li>
            </ul>
            <div class="d-flex align-items-center justify-content-between text-muted mt-auto pt-3 border-top">
                <div>
                    <i class="bi bi-person-circle fs-5 me-2"></i>
                    <small class="fw-semibold">Admin</small>
                </div>
                <button class="btn btn-sm btn-outline-danger border-0 rounded-circle" id="btnCerrarSesion" title="Cerrar sesión">
                    <i class="bi bi-box-arrow-right fs-5"></i>
                </button>
            </div>
        </div>

        <!-- Contenido Principal -->
        <div class="flex-grow-1 p-4 p-md-5">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 class="fw-bold mb-0">Base de Datos de Alimentos</h3>
                <button class="btn btn-primary fw-bold px-4 rounded-3 shadow-sm" onclick="abrirModal()">
                    <i class="bi bi-plus-lg me-2"></i>Nuevo Alimento
                </button>
            </div>

            <div class="mb-4">
                <input type="text" id="buscador" class="form-control form-control-lg bg-white border-0 shadow-sm" placeholder="Buscar alimento...">
            </div>

            <div class="border rounded-3 bg-white shadow-sm overflow-hidden">
                <table class="table table-hover align-middle mb-0" id="tabla-alimentos-container">
                    <thead class="table-light">
                        <tr>
                            <th class="ps-4">Alimento</th>
                            <th>Unidades y Kcal</th>
                            <th class="text-center pe-4">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-alimentos">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal de Formulario -->
    <div class="modal fade" id="modalAlimento" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold" id="modalTitulo">Nuevo Alimento</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="formAlimento">
                        <input type="hidden" id="alimentoId">
                        <div class="mb-4">
                            <label class="form-label small fw-semibold text-secondary">Nombre del Alimento</label>
                            <input type="text" id="alimentoNombre" class="form-control bg-light border-0" required>
                        </div>
                        <div class="mb-3">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <label class="form-label small fw-semibold text-secondary mb-0">Unidades Disponibles</label>
                                <button type="button" class="btn btn-sm btn-outline-primary fw-bold" onclick="agregarFilaUnidad()">+ Añadir unidad</button>
                            </div>
                            <div id="contenedorUnidades"></div>
                        </div>
                        <button type="submit" id="btnGuardar" class="btn btn-primary w-100 py-2 rounded-3 fw-bold mt-2">Guardar en Catálogo</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="admin.js"></script>
</body>
</html>
