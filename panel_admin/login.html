<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriApp Admin - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8f9fa; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { background: white; padding: 2.5rem; border-radius: 1rem; box-shadow: 0 10px 30px rgba(0,0,0,0.05); width: 100%; max-width: 400px; }
        .form-control:focus { box-shadow: none; border-color: #1E88E5; }
    </style>
</head>
<body>

    <div class="login-card text-center">
        <img src="assets/icon_login_leaf.png" alt="NutriApp" width="56" height="56" class="mb-3">
        <h4 class="fw-bold mb-1">NutriApp Panel</h4>

        <form id="loginForm">
            <div class="mb-3 text-start">
                <label class="form-label small fw-semibold text-secondary">Correo electrónico</label>
                <input type="email" id="email" class="form-control form-control-lg bg-light border-0" required>
            </div>
            <div class="mb-4 text-start">
                <label class="form-label small fw-semibold text-secondary">Contraseña</label>
                <div class="input-group">
                    <input type="password" id="password" class="form-control form-control-lg bg-light border-0" required>
                    <button class="btn btn-light bg-light border-0 text-secondary" type="button" id="btnTogglePass">
                        <i class="bi bi-eye-fill" id="iconoOjo"></i>
                    </button>
                </div>
            </div>
            
            <button type="submit" id="btnLogin" class="btn btn-primary w-100 py-3 rounded-3 fw-bold">Ingresar al Panel</button>
            <div id="errorMsg" class="text-danger mt-3 small fw-semibold d-none"></div>
        </form>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDyrMofbBJwepKxQKU6MC42HNWDwNaPCW8",
            authDomain: "nutriapp-grupo6.firebaseapp.com",
            projectId: "nutriapp-grupo6",
            storageBucket: "nutriapp-grupo6.firebasestorage.app",
            messagingSenderId: "190206968334",
            appId: "1:190206968334:web:c32281725602697beab25f"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Funcionalidad para mostrar/ocultar contraseña
        document.getElementById('btnTogglePass').addEventListener('click', function() {
            const inputPass = document.getElementById('password');
            const iconoOjo = document.getElementById('iconoOjo');
            
            if (inputPass.type === 'password') {
                inputPass.type = 'text';
                iconoOjo.classList.replace('bi-eye-fill', 'bi-eye-slash-fill'); // Cambia al ojito tachado
            } else {
                inputPass.type = 'password';
                iconoOjo.classList.replace('bi-eye-slash-fill', 'bi-eye-fill'); // Vuelve al ojito normal
            }
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim().toLowerCase();
            const password = document.getElementById('password').value;
            const btnLogin = document.getElementById('btnLogin');
            const errorMsg = document.getElementById('errorMsg');

            if (email !== 'admin_nutriapp@gmail.com') {
                errorMsg.innerText = "Acceso denegado. Cuenta sin privilegios administrativos.";
                errorMsg.classList.remove('d-none');
                return;
            }

            btnLogin.disabled = true;
            btnLogin.innerText = "Verificando...";
            errorMsg.classList.add('d-none');

            try {
                await signInWithEmailAndPassword(auth, email, password);
                window.location.href = "index.html"; // Redirigir al panel
            } catch (error) {
                errorMsg.innerText = "Contraseña incorrecta o error de conexión.";
                errorMsg.classList.remove('d-none');
                btnLogin.disabled = false;
                btnLogin.innerText = "Ingresar al Panel";
            }
        });
    </script>
</body>
</html>
