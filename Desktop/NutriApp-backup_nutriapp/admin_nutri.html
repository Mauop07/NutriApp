<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCRUM 34-38: Panel Administrativo - NutriApp</title>
    <!-- Bootstrap CSS para un diseño limpio y rápido -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- SCRUM-34: Panel Administrativo (Navbar y estructura general) -->
    <nav class="navbar navbar-dark bg-success shadow-sm">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">NutriApp - Panel Administrativo (SCRUM 34 al 38)</span>
        </div>
    </nav>

    <div class="container my-4">
        
        <!-- Tarjeta de Acciones: SCRUM-36 (Creación) y SCRUM-35 (Búsqueda) -->
        <div class="row mb-4">
            <div class="col-md-6 mb-3">
                <div class="card shadow-sm">
                    <div class="card-header bg-white fw-bold">SCRUM-36: Crear / <span id="form-title">Registrar</span> Alimento</div>
                    <div class="card-body">
                        <form id="food-form">
                            <input type="hidden" id="food-id">
                            <div class="mb-3">
                                <label for="food-name" class="form-label">Nombre del Alimento</label>
                                <input type="text" class="form-control" id="food-name" required>
                            </div>
                            <div class="mb-3">
                                <label for="food-calories" class="form-label">Calorías (kcal)</label>
                                <input type="number" class="form-control" id="food-calories" required>
                            </div>
                            <button type="submit" class="btn btn-success w-100" id="btn-save">Guardar Alimento</button>
                            <button type="button" class="btn btn-secondary w-100 mt-2 d-none" id="btn-cancel" onclick="resetForm()">Cancelar</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card shadow-sm h-100">
                    <div class="card-header bg-white fw-bold">SCRUM-35: Búsqueda de Alimentos</div>
                    <div class="card-body d-flex flex-column justify-content-center">
                        <label for="search-input" class="form-label">Buscar por nombre:</label>
                        <input type="text" class="form-control" id="search-input" placeholder="Escribe para filtrar..." oninput="filterFoods()">
                    </div>
                </div>
            </div>
        </div>

        <!-- SCRUM-35, 37 y 38: Listado, Edición y Eliminación -->
        <div class="card shadow-sm">
            <div class="card-header bg-white fw-bold">Listado de Alimentos Registrados (SCRUM-35)</div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Calorías</th>
                                <th class="text-end">Acciones (SCRUM-37 / 38)</th>
                            </tr>
                        </thead>
                        <tbody id="food-table-body">
                            <!-- Los datos se inyectan dinámicamente -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Lógica JavaScript para cubrir todo el CRUD de los tickets de Scrum -->
    <script>
        // Base de datos simulada en memoria / LocalStorage
        let foods = JSON.parse(localStorage.getItem('nutri_foods')) || [
            id = 1, name: 'Manzana', calories: 52 },
            { id: 2, name: 'Pechuga de Pollo', calories: 165 },
            { id: 3, name: 'Arroz Integral', calories: 111 }
        ];

        const form = document.getElementById('food-form');
        const tableBody = document.getElementById('food-table-body');
        const searchInput = document.getElementById('search-input');

        // Renderizar tabla al cargar
        document.addEventListener('DOMContentLoaded', renderTable);

        function renderTable(dataToRender = foods) {
            tableBody.innerHTML = '';
            if (dataToRender.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="4" class="text-center text-muted">No hay alimentos registrados.</td></tr>`;
                return;
            }

            dataToRender.forEach(food => {
                tableBody.innerHTML += `
                    <tr>
                        <td>#${food.id}</td>
                        <td>${food.name}</td>
                        <td>${food.calories} kcal</td>
                        <td class="text-end">
                            <button class="btn btn-sm btn-primary me-2" onclick="editFood(${food.id})">Editar (SCRUM-37)</button>
                            <button class="btn btn-sm btn-danger" onclick="deleteFood(${food.id})">Eliminar (SCRUM-38)</button>
                        </td>
                    </tr>
                `;
            });
        }

        // SCRUM-36: Crear o Actualizar Alimento
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            const idField = document.getElementById('food-id').value;
            const name = document.getElementById('food-name').value;
            const calories = document.getElementById('food-calories').value;

            if (idField) {
                // Actualizar (SCRUM-37)
                foods = foods.map(f => f.id == idField ? { id: Number(idField), name, calories: Number(calories) } : f);
            } else {
                // Crear (SCRUM-36)
                const newId = foods.length > 0 ? Math.max(...foods.map(f => f.id)) + 1 : 1;
                foods.push({ id: newId, name, calories: Number(calories) });
            }

            saveAndRefresh();
            resetForm();
        });

        // SCRUM-37: Cargar datos para edición
        function editFood(id) {
            const food = foods.find(f => f.id === id);
            if (food) {
                document.getElementById('food-id').value = food.id;
                document.getElementById('food-name').value = food.name;
                document.getElementById('food-calories').value = food.calories;
                document.getElementById('form-title').innerText = "Editar";
                document.getElementById('btn-save').innerText = "Actualizar Alimento";
                document.getElementById('btn-cancel').classList.remove('d-none');
            }
        }

        // SCRUM-38: Eliminar alimento
        function deleteFood(id) {
            if (confirm('¿Estás seguro de eliminar este alimento del panel?')) {
                foods = foods.filter(f => f.id !== id);
                saveAndRefresh();
            }
        }

        // SCRUM-35: Filtrar / Búsqueda en tiempo real
        function filterFoods() {
            const query = searchInput.value.toLowerCase();
            const filtered = foods.filter(f => f.name.toLowerCase().includes(query));
            renderTable(filtered);
        }

        function resetForm() {
            form.reset();
            document.getElementById('food-id').value = '';
            document.getElementById('form-title').innerText = "Registrar";
            document.getElementById('btn-save').innerText = "Guardar Alimento";
            document.getElementById('btn-cancel').classList.add('d-none');
        }

        function saveAndRefresh() {
            localStorage.setItem('nutri_foods', JSON.stringify(foods));
            renderTable();
        }
    </script>
</body>
</html>
